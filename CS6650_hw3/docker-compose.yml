version: "3.8"

services:
  locust-master:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./:/mnt/locust
    command: >
      -f /mnt/locust/locustfile.py
      --master
      --web-host=0.0.0.0
      -H http://host.docker.internal:8080

  locust-worker:
    image: locustio/locust
    depends_on:
      - locust-master
    volumes:
      - ./:/mnt/locust
    command: >
      -f /mnt/locust/locustfile.py
      --worker
      --master-host=locust-master
